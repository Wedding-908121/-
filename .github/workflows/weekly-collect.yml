name: Collect and publish mechanical intelligence

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      resummarize:
        description: "重新生成采集窗口内已有资料的 AI 摘要"
        required: false
        type: boolean
        default: false
permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: mech-intel-pages
  cancel-in-progress: false

jobs:
  collect-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm install

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Build
        run: npm run build
        env:
          PUBLIC_BASE_URL: https://Wedding-908121.github.io/-

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
