<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#153a31">
    <meta name="description" content="机械中心传动技术部的风电行业与传动链在线情报平台，每周自动汇集公开全文、论文和企业项目动态。">
    <meta property="og:title" content="机械中心-传动技术部在线平台">
    <meta property="og:description" content="每周更新的风电传动链技术、故障、论文、厂商项目与产业环境情报。">
    <meta property="og:image" content="https://WxF5ve.github.io/wind-drivetrain-intelligence/assets/share-cover.png">
    <meta property="og:url" content="https://WxF5ve.github.io/wind-drivetrain-intelligence/">
    <link rel="canonical" href="https://WxF5ve.github.io/wind-drivetrain-intelligence/">
    <meta property="og:type" content="website">
    <title>机械中心-传动技术部在线平台</title>
    <link rel="manifest" href="./manifest.webmanifest">
    <link rel="icon" href="./assets/icon-192.png">
    <link rel="stylesheet" href="./styles.css">
    <script src="./vendor/lucide.min.js" defer></script>
    <script src="./runtime-config.js"></script>
    <script src="./app.js" type="module"></script>
  </head>
  <body>
    <a class="skip-link" href="#article-feed">跳到资讯列表</a>

    <header class="topbar">
      <div class="topbar-inner">
        <a class="brand" href="./" aria-label="机械中心-传动技术部在线平台首页">
          <span class="brand-mark" aria-hidden="true">
            <i data-lucide="chart-no-axes-combined"></i>
          </span>
          <span>
            <strong><span>机械中心-</span><span>传动技术部在线平台</span></strong>
            <small>风电行业与传动链工程情报</small>
          </span>
        </a>
        <div class="topbar-actions">
          <span class="freshness" id="freshness">
            <span class="status-dot" aria-hidden="true"></span>
            正在同步
          </span>
          <button class="icon-button" id="share-app" type="button" title="分享平台" aria-label="分享机械中心-传动技术部在线平台">
            <i data-lucide="share-2"></i>
          </button>
          <button class="icon-button mobile-only" id="open-filters-mobile" type="button" title="筛选资讯" aria-label="筛选资讯">
            <i data-lucide="sliders-horizontal"></i>
          </button>
        </div>
      </div>
    </header>

    <main>
      <section class="brief-band" aria-labelledby="brief-title">
        <div class="brief-media" aria-hidden="true"></div>
        <div class="content-shell brief-inner">
          <div class="brief-main">
            <div class="eyebrow">
              <i data-lucide="calendar-range"></i>
              <span id="brief-period">本周情报简报</span>
              <span class="brief-mode" id="brief-mode">加载中</span>
            </div>
            <h1 id="brief-title">正在整理本周传动链情报</h1>
            <p id="brief-summary">正在加载最新采集结果与工程摘要。</p>
            <div class="signal-list" id="signal-list" aria-label="本周关键信号"></div>
            <div class="brief-actions">
              <button class="weekly-report-trigger" id="open-weekly-report" type="button">
                <i data-lucide="file-chart-column"></i>
                生成最近一周 PDF 周报
              </button>
            </div>
          </div>
          <div class="brief-metrics" aria-label="本周资料统计">
            <div class="metric">
              <strong id="metric-total">--</strong>
              <span>高相关资料</span>
            </div>
            <div class="metric">
              <strong id="metric-domestic">--</strong>
              <span>国内资讯</span>
            </div>
            <div class="metric">
              <strong id="metric-papers">--</strong>
              <span>研究论文</span>
            </div>
          </div>
        </div>
      </section>

      <section class="content-shell workspace" aria-label="情报工作台">
        <div class="primary-column">
          <div class="search-panel">
            <label class="search-box" for="search-input">
              <i data-lucide="search" aria-hidden="true"></i>
              <input id="search-input" type="search" autocomplete="off" placeholder="搜索工艺、失效、仿真、企业、项目或论文">
              <kbd>Ctrl K</kbd>
              <button class="clear-search" id="clear-search" type="button" title="清空搜索" aria-label="清空搜索" hidden>
                <i data-lucide="x"></i>
              </button>
            </label>
            <button class="filter-button desktop-only" id="open-filters" type="button">
              <i data-lucide="sliders-horizontal"></i>
              筛选
              <span class="filter-count" id="filter-count" hidden>0</span>
            </button>
          </div>

          <div class="category-navigation">
            <div class="category-heading">主栏目</div>
            <nav class="category-tabs" id="category-tabs" aria-label="主栏目">
              <button class="category-tab active" type="button" data-category="传动链技术开发与质量运维"><span>传动链技术开发与质量运维</span><strong data-category-count>0</strong></button>
              <button class="category-tab" type="button" data-category="论文、标准与专利"><span>论文、标准与专利</span><strong data-category-count>0</strong></button>
              <button class="category-tab" type="button" data-category="厂商与项目动态"><span>厂商与项目动态</span><strong data-category-count>0</strong></button>
              <button class="category-tab" type="button" data-category="政策、市场与产业环境"><span>政策、市场与产业环境</span><strong data-category-count>0</strong></button>
              <button class="category-tab" type="button" data-category="综合资讯与待深读线索"><span>综合资讯与待深读线索</span><strong data-category-count>0</strong></button>
              <button class="category-tab utility-tab" type="button" data-category="全部"><span>全部</span><strong data-category-count>0</strong></button>
            </nav>
          </div>
          <div class="dimension-filters" id="dimension-filters" aria-label="部件与动态分类筛选"></div>

          <div class="feed-toolbar">
            <div>
              <h2 id="feed-title">最新情报</h2>
              <p id="result-count" aria-live="polite">正在加载资料</p>
            </div>
            <div class="segmented-control" role="group" aria-label="排序方式">
              <button class="active" type="button" data-sort="latest">最新</button>
              <button type="button" data-sort="reliability">可靠度</button>
              <button type="button" data-sort="personal">为我推荐</button>
            </div>
          </div>

          <div class="active-filters" id="active-filters" aria-label="已启用筛选条件"></div>
          <div class="article-feed" id="article-feed" aria-live="polite">
            <div class="loading-card"></div>
            <div class="loading-card"></div>
            <div class="loading-card"></div>
          </div>
        </div>

        <aside class="insight-rail" aria-label="个性化情报">
          <section class="rail-section">
            <div class="section-heading">
              <div>
                <span class="section-kicker">WATCHLIST</span>
                <h2>关注关键词</h2>
              </div>
              <i data-lucide="radar" aria-hidden="true"></i>
            </div>
            <form class="watch-form" id="watch-form">
              <label class="sr-only" for="watch-input">新增关注关键词</label>
              <input id="watch-input" maxlength="24" placeholder="例如：行星架轴承">
              <button class="icon-button" type="submit" title="添加关键词" aria-label="添加关键词">
                <i data-lucide="plus"></i>
              </button>
            </form>
            <div class="watch-list" id="watch-list"></div>
          </section>

          <section class="rail-section">
            <div class="section-heading">
              <div>
                <span class="section-kicker">TREND RADAR</span>
                <h2>主题热度</h2>
              </div>
              <i data-lucide="activity" aria-hidden="true"></i>
            </div>
            <div class="trend-list" id="trend-list"></div>
          </section>

          <section class="rail-section saved-summary">
            <div>
              <span class="section-kicker">LIBRARY</span>
              <h2>我的收藏</h2>
              <p><strong id="saved-count">0</strong> 条资料保存在本机</p>
            </div>
            <button class="quiet-button" id="show-saved" type="button">
              查看
              <i data-lucide="arrow-right"></i>
            </button>
          </section>
        </aside>
      </section>
    </main>

    <nav class="mobile-nav mobile-only" aria-label="移动端导航">
      <button class="active" type="button" data-view="all">
        <i data-lucide="newspaper"></i>
        <span>情报</span>
      </button>
      <button type="button" data-view="search">
        <i data-lucide="search"></i>
        <span>搜索</span>
      </button>
      <button type="button" data-view="saved">
        <i data-lucide="bookmark"></i>
        <span>收藏</span>
      </button>
    </nav>

    <dialog class="article-dialog" id="article-dialog">
      <div class="dialog-shell">
        <div class="dialog-header">
          <span class="dialog-source" id="dialog-source"></span>
          <button class="icon-button" id="close-dialog" type="button" title="关闭" aria-label="关闭">
            <i data-lucide="x"></i>
          </button>
        </div>
        <div id="dialog-content"></div>
      </div>
    </dialog>

    <dialog class="weekly-report-dialog" id="weekly-report-dialog">
      <div class="weekly-report-shell">
        <header class="weekly-report-toolbar">
          <div>
            <strong>机械中心-传动技术部风电情报周报</strong>
            <small id="weekly-report-toolbar-period">最近一周</small>
          </div>
          <div class="weekly-report-tools">
            <button class="icon-button" id="copy-weekly-report" type="button" title="复制周报" aria-label="复制周报">
              <i data-lucide="copy"></i>
            </button>
            <button class="icon-button" id="download-weekly-report" type="button" title="下载 PDF" aria-label="下载 PDF">
              <i data-lucide="file-down"></i>
            </button>
            <button class="icon-button" id="share-weekly-report" type="button" title="分享周报" aria-label="分享周报">
              <i data-lucide="share-2"></i>
            </button>
            <button class="icon-button" id="close-weekly-report" type="button" title="关闭" aria-label="关闭">
              <i data-lucide="x"></i>
            </button>
          </div>
        </header>
        <div class="weekly-report" id="weekly-report-content"></div>
      </div>
    </dialog>

    <dialog class="filter-dialog" id="filter-dialog">
      <form class="filter-shell" method="dialog" id="filter-form">
        <div class="filter-header">
          <div>
            <span class="section-kicker">FILTERS</span>
            <h2>筛选资讯</h2>
          </div>
          <button class="icon-button" value="cancel" type="submit" title="关闭" aria-label="关闭">
            <i data-lucide="x"></i>
          </button>
        </div>
        <fieldset>
          <legend>来源地区</legend>
          <label><input type="radio" name="region" value="全部" checked> 全部</label>
          <label><input type="radio" name="region" value="国内"> 国内</label>
          <label><input type="radio" name="region" value="海外"> 海外</label>
        </fieldset>
        <fieldset>
          <legend>资料类型</legend>
          <label><input type="radio" name="sourceType" value="全部" checked> 全部</label>
          <label><input type="radio" name="sourceType" value="论文"> 论文</label>
          <label><input type="radio" name="sourceType" value="资讯"> 行业与技术资讯</label>
        </fieldset>
        <div class="filter-actions">
          <button class="quiet-button" id="reset-filters" type="button">重置</button>
          <button class="primary-button" value="apply" type="submit">
            <i data-lucide="check"></i>
            应用筛选
          </button>
        </div>
      </form>
    </dialog>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
  </body>
</html>
